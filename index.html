<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería & Boutique</title>
  <style>
    :root {
      --bg: #0F0F11;
      --surface: #18181C;
      --surface-card: #202026;
      --primary: #FFFFFF;
      --accent: #25D366;
      --accent-hover: #1EBE5D;
      --gold: #D4AF37;
      --gold-glow: rgba(212, 175, 55, 0.25);
      --muted: #A0A0AB;
      --border: #2A2A32;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      --font-serif: "Playfair Display", Georgia, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--primary);
      font-family: var(--font-sans);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Header Nav con Blur */
    header {
      position: sticky;
      top: 0;
      background: rgba(15, 15, 17, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      transition: all 0.3s ease;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--primary);
      background: linear-gradient(135deg, #FFF 0%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .cart-btn {
      position: relative;
      background: var(--surface-card);
      border: 1px solid var(--border);
      color: var(--primary);
      padding: 0.6rem 1.4rem;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .cart-btn:hover {
      border-color: var(--gold);
      box-shadow: 0 0 15px var(--gold-glow);
      transform: translateY(-2px);
    }

    .cart-count {
      background: var(--gold);
      color: #000;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Galería Layout */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2.5rem;
    }

    /* Tarjetas de Producto con Animaciones */
    .card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      position: relative;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.3s ease,
                  box-shadow 0.3s ease;
    }

    .card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: var(--gold);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px var(--gold-glow);
    }

    /* Tag de Número flotante */
    .card-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(15, 15, 17, 0.75);
      backdrop-filter: blur(8px);
      color: var(--gold);
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      z-index: 10;
    }

    .card-img-wrap {
      position: relative;
      width: 100%;
      height: 380px;
      overflow: hidden;
      background: #121215;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card:hover img {
      transform: scale(1.08);
    }

    .card-body {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-price {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
    }

    .btn-add {
      background: linear-gradient(135deg, #2A2A35 0%, #1A1A22 100%);
      color: var(--primary);
      border: 1px solid var(--border);
      padding: 0.75rem 1.3rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .card:hover .btn-add {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
      font-weight: 700;
    }

    .btn-add:active {
      transform: scale(0.95);
    }

    /* Drawer de Carrito */
    .cart-drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .cart-drawer-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .cart-drawer {
      position: fixed;
      top: 0;
      right: -450px;
      width: 100%;
      max-width: 450px;
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 201;
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.5);
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .cart-drawer.active {
      right: 0;
    }

    .drawer-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-header h2 {
      font-family: var(--font-serif);
      font-size: 1.3rem;
      color: var(--gold);
    }

    .close-drawer {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: var(--muted);
      transition: color 0.2s;
    }

    .close-drawer:hover {
      color: var(--primary);
    }

    .drawer-content {
      padding: 1.5rem;
      flex-grow: 1;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      gap: 12px;
      margin-bottom: 1.2rem;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid var(--border);
      align-items: center;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .cart-item img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .cart-item-info {
      flex-grow: 1;
    }

    .cart-item-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .cart-item-price {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .btn-remove {
      background: none;
      border: none;
      color: #FF5252;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 4px;
    }

    .checkout-form {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px dashed var(--border);
    }

    .form-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 1rem;
    }

    .input-group {
      margin-bottom: 0.8rem;
    }

    .input-group input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      background: #101014;
      color: var(--primary);
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .drawer-footer {
      padding: 1.5rem;
      border-top: 1px solid var(--border);
      background: #141418;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .summary-line.total {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }

    .btn-send-wa {
      width: 100%;
      background: var(--accent);
      color: #FFF;
      border: none;
      padding: 1rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-send-wa:hover {
      background: var(--accent-hover);
      box-shadow: 0 0 20px rgba(37, 211, 102, 0.3);
    }

    .empty-cart-msg {
      text-align: center;
      color: var(--muted);
      padding: 3rem 0;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="nav-container">
      <a href="#" class="logo">Galería</a>
      <button class="cart-btn" onclick="toggleCart()">
        <span>Carrito</span>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <!-- Galería de Fotos (1.jpg a 5.jpg) -->
  <main class="container">
    <div class="grid">

      <!-- Producto 1 -->
      <article class="card">
        <span class="card-badge">#01</span>
        <div class="card-img-wrap">
          <img src="1.jpg" alt="Pieza 1">
        </div>
        <div class="card-body">
          <div class="card-footer">
            <span class="card-price">$0 MXN</span>
            <button class="btn-add" onclick="agregarAlCarrito('Pieza 1', 0, '1.jpg')">Agregar al Carrito</button>
          </div>
        </div>
      </article>

      <!-- Producto 2 -->
      <article class="card">
        <span class="card-badge">#02</span>
        <div class="card-img-wrap">
          <img src="2.jpg" alt="Pieza 2">
        </div>
        <div class="card-body">
          <div class="card-footer">
            <span class="card-price">$0 MXN</span>
            <button class="btn-add" onclick="agregarAlCarrito('Pieza 2', 0, '2.jpg')">Agregar al Carrito</button>
          </div>
        </div>
      </article>

      <!-- Producto 3 -->
      <article class="card">
        <span class="card-badge">#03</span>
        <div class="card-img-wrap">
          <img src="3.jpg" alt="Pieza 3">
        </div>
        <div class="card-body">
          <div class="card-footer">
            <span class="card-price">$0 MXN</span>
            <button class="btn-add" onclick="agregarAlCarrito('Pieza 3', 0, '3.jpg')">Agregar al Carrito</button>
          </div>
        </div>
      </article>

      <!-- Producto 4 -->
      <article class="card">
        <span class="card-badge">#04</span>
        <div class="card-img-wrap">
          <img src="4.jpg" alt="Pieza 4">
        </div>
        <div class="card-body">
          <div class="card-footer">
            <span class="card-price">$0 MXN</span>
            <button class="btn-add" onclick="agregarAlCarrito('Pieza 4', 0, '4.jpg')">Agregar al Carrito</button>
          </div>
        </div>
      </article>

      <!-- Producto 5 -->
      <article class="card">
        <span class="card-badge">#05</span>
        <div class="card-img-wrap">
          <img src="5.jpg" alt="Pieza 5">
        </div>
        <div class="card-body">
          <div class="card-footer">
            <span class="card-price">$0 MXN</span>
            <button class="btn-add" onclick="agregarAlCarrito('Pieza 5', 0, '5.jpg')">Agregar al Carrito</button>
          </div>
        </div>
      </article>

    </div>
  </main>

  <!-- Panel Carrito -->
  <div class="cart-drawer-overlay" id="cartOverlay" onclick="toggleCart()"></div>
  
  <aside class="cart-drawer" id="cartDrawer">
    <div class="drawer-header">
      <h2>Carrito de Compra</h2>
      <button class="close-drawer" onclick="toggleCart()">&times;</button>
    </div>

    <div class="drawer-content" id="drawerContent">
      <div id="cartItemsContainer">
        <p class="empty-cart-msg">Tu carrito está vacío.</p>
      </div>

      <form class="checkout-form" id="checkoutForm" style="display: none;">
        <h3 class="form-title">Datos para la Entrega</h3>
        <div class="input-group">
          <input type="text" id="custName" placeholder="Nombre completo" required>
        </div>
        <div class="input-group">
          <input type="tel" id="custPhone" placeholder="Teléfono de contacto" required>
        </div>
        <div class="input-group">
          <input type="text" id="custAddress" placeholder="Calle, Número y Colonia" required>
        </div>
        <div class="input-group">
          <input type="text" id="custCP" placeholder="Código Postal (5 dígitos)" maxlength="5" required>
        </div>
        <div class="input-group">
          <input type="text" id="custCity" placeholder="Ciudad y Estado" required>
        </div>
      </form>
    </div>

    <div class="drawer-footer" id="drawerFooter" style="display: none;">
      <div class="summary-line">
        <span>Subtotal</span>
        <span id="subtotalVal">$0 MXN</span>
      </div>
      <div class="summary-line">
        <span>Envío</span>
        <span>A convenir</span>
      </div>
      <div class="summary-line total">
        <span>Total</span>
        <span id="totalVal">$0 MXN</span>
      </div>

      <button class="btn-send-wa" onclick="enviarPedidoWhatsApp()">
        <span>Enviar Pedido por WhatsApp</span> 📲
      </button>
    </div>
  </aside>

  <script>
    const WHATSAPP_PHONE = "5213311848518";
    let cart = [];

    // Animación Reveal al scrollear
    const cards = document.querySelectorAll('.card');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry, index) => {
        if (entry.isIntersecting) {
          setTimeout(() => {
            entry.target.classList.add('visible');
          }, index * 100);
        }
      });
    }, { threshold: 0.1 });

    cards.forEach(card => observer.observe(card));

    function toggleCart() {
      document.getElementById('cartOverlay').classList.toggle('active');
      document.getElementById('cartDrawer').classList.toggle('active');
    }

    function agregarAlCarrito(nombre, precio, img) {
      const itemExistente = cart.find(p => p.nombre === nombre);
      if (itemExistente) {
        itemExistente.cantidad++;
      } else {
        cart.push({ nombre, precio, img, cantidad: 1 });
      }
      actualizarCarritoUI();
      toggleCart();
    }

    function removerDelCarrito(nombre) {
      cart = cart.filter(p => p.nombre !== nombre);
      actualizarCarritoUI();
    }

    function actualizarCarritoUI() {
      const container = document.getElementById('cartItemsContainer');
      const cartCount = document.getElementById('cartCount');
      const checkoutForm = document.getElementById('checkoutForm');
      const drawerFooter = document.getElementById('drawerFooter');

      const totalItems = cart.reduce((acc, item) => acc + item.cantidad, 0);
      cartCount.innerText = totalItems;

      if (cart.length === 0) {
        container.innerHTML = '<p class="empty-cart-msg">Tu carrito está vacío.</p>';
        checkoutForm.style.display = 'none';
        drawerFooter.style.display = 'none';
        return;
      }

      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <img src="${item.img}" alt="${item.nombre}">
          <div class="cart-item-info">
            <div class="cart-item-title">${item.nombre}</div>
            <div class="cart-item-price">Cant: ${item.cantidad} x $${item.precio.toLocaleString()} MXN</div>
          </div>
          <button class="btn-remove" onclick="removerDelCarrito('${item.nombre}')">Eliminar</button>
        </div>
      `).join('');

      const total = cart.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);
      document.getElementById('subtotalVal').innerText = `$${total.toLocaleString()} MXN`;
      document.getElementById('totalVal').innerText = `$${total.toLocaleString()} MXN`;

      checkoutForm.style.display = 'block';
      drawerFooter.style.display = 'block';
    }

    function enviarPedidoWhatsApp() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      const cp = document.getElementById('custCP').value.trim();
      const city = document.getElementById('custCity').value.trim();

      if (!name || !address || !cp) {
        alert("Por favor completa los campos obligatorios de entrega (Nombre, Dirección y Código Postal).");
        return;
      }

      let resumenProductos = "";
      let totalPagar = 0;

      cart.forEach((item, index) => {
        const sub = item.precio * item.cantidad;
        totalPagar += sub;
        resumenProductos += `${index + 1}. *${item.nombre}* (x${item.cantidad}) - $${sub.toLocaleString()} MXN%0A`;
      });

      const mensajeWA = `*¡NUEVO PEDIDO DESDE LA WEB!*%0A%0A` +
        `*--- PIEZAS SELECCIONADAS ---*%0A` +
        `${resumenProductos}%0A` +
        `*TOTAL ESTIMADO:* $${totalPagar.toLocaleString()} MXN%0A%0A` +
        `*--- DATOS DE ENTREGA ---*%0A` +
        `*Cliente:* ${name}%0A` +
        `*Teléfono:* ${phone}%0A` +
        `*Dirección:* ${address}%0A` +
        `*C.P.:* ${cp}%0A` +
        `*Ciudad/Estado:* ${city}`;

      const link = `https://wa.me/${WHATSAPP_PHONE}?text=${mensajeWA}`;
      window.open(link, '_blank');
    }
  </script>
</body>
</html>
